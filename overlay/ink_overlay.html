<!-- ===== INK OVERLAY START (v29) =====
  Smartboard writing layer. Paste this whole block just before </body> in any .html file.
  SMART BOARD: pen tip writes. Palm, fist or side of hand erases (the board reports it as an eraser).
  Finger (and the round end of the SMART pen) scrolls the page; the "Finger" button switches it to drawing if you lose the pen.
  HIGHLIGHTER: toggle it on (starts yellow; it remembers its own color separately from the pen), then any color highlights. Highlights sit under the pen ink and never hide the printed text.
  The ▾ beside it: highlight strength, or COVER (a solid black or gray bar that hides answers; wipe it away with your palm to reveal them).
  Works best with fixed-size .page elements (any paper size): Page jump and Save PDF then work per page.
  Without .page elements it still scrolls and prints the whole body as one sheet.
  PERIODS: each class period (P1-P4) keeps its own ink on the same worksheet. Tap a period button to switch.
  SAVING: ink always auto-saves in this browser. File ▸ "Save ink into file" (Chrome or Edge) also writes the ink INTO this .html file,
  so use a board copy of the sheet, not the copy you hand out.
  Settings are the variables at the top of the script. ===== -->

  <div id="ob-zoom"><button data-act="zoom-out" aria-label="Zoom out" title="Zoom out" data-ta="zoom_out" data-tt="zoom_out">&minus;</button><button data-act="zoom-fit" class="sm" data-tt="zoom_tip" title="Page zoom. Tap to fit the page to the screen.">100%</button><button data-act="zoom-in" aria-label="Zoom in" title="Zoom in" data-ta="zoom_in" data-tt="zoom_in">+</button></div>
  <button data-act="timer" class="sm wide" data-t="timer_btn" data-tt="timer_tip" title="A big countdown for the class, with a sound at zero">&#9201; Timer</button>
  <button data-act="file" aria-haspopup="true" aria-expanded="false" data-t="menu" data-tt="menu_tip" title="Save PDF, save ink into the file, settings, language and help">Settings &amp; help &#9656;</button>

</div>
<div id="ob-filemenu" role="menu" aria-label="Settings and help" data-ta="menu_name" hidden>
  <button data-act="print" class="wide" data-t="save_pdf" data-tt="save_pdf_tip" title="Save or print a PDF of the worksheet with the current period's ink">Save PDF</button>
  <button data-act="savefile" class="sm wide" data-t="save_into_file" data-tt="save_into_file_tip" title="Ink already saves in this browser. This also saves it inside the .html file.">Save ink into file</button>
  <button data-act="pickfile" class="sm wide" data-t="change_file" data-tt="change_file_tip" title="Choose which .html file the ink saves into">Change linked file</button>

</div>
<button id="ink-show" aria-label="Show writing tools" title="Show writing tools" data-ta="show_tip" data-tt="show_tip">&#9998;</button>
<script id="ink-script">
(function(){
  if (window.__inkLoaded) return; window.__inkLoaded = true;

  /* ===== SHARED CORE: generated from shared/ink-core.js by tools/build_overlay.py; edit that file ===== */
  /* OverBoard shared ink core.
     Used two ways:
     - as an ES module by the PDF app (app/*.js imports it), and
     - inlined into the paste-in overlay (overlay/ink_overlay.html) by tools/build_overlay.py.
     So: plain ES5 function declarations only, no imports, no top-level state.
     The export line at the bottom is stripped when it is inlined.

     Stroke: { c: color, w: width, e: 1 if eraser, h: 1 if highlight, o: 1 if cover (opaque highlight), p: [x0,y0,x1,y1,...] }  */

  /* mix a #rrggbb color toward white (amt 0..1) */
  function tint(hex, amt){
    var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    function m(c){ return Math.round(c + (255 - c) * amt); }
    return '#' + ((1 << 24) | (m(r) << 16) | (m(g) << 8) | m(b)).toString(16).slice(1);
  }

  /* SMART Board on macOS: pen tip = "pen"; palm/fist/side of hand = "pen" with the eraser button (32);
     finger and the pen's round end = "mouse". Touch screens report "touch". */
  function pointerKind(e){
    if (e.pointerType === 'pen' && ((e.buttons & 32) || e.button === 5)) return 'palm';
    if (e.pointerType === 'mouse' || e.pointerType === 'touch') return 'finger';
    return 'pen';
  }

  function inkStyle(g, s, sc, ox, oy){
    g.setTransform(sc, 0, 0, sc, ox, oy);
    g.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    g.strokeStyle = s.c; g.fillStyle = s.c; g.lineWidth = s.w;
    g.lineCap = 'round'; g.lineJoin = 'round';
  }

  /* one whole stroke onto one canvas: quadratic curves through the midpoints between samples,
     so corners come out round instead of jagged. Ink coordinates map to canvas px as x*sc+ox. */
  function paintStroke(g, s, sc, ox, oy){
    var p = s.p; g.save(); inkStyle(g, s, sc, ox, oy);
    g.beginPath();
    if (p.length < 4) { g.arc(p[0], p[1], s.w/2, 0, 6.2832); g.fill(); }
    else {
      g.moveTo(p[0], p[1]);
      for (var i = 2; i < p.length - 2; i += 2) g.quadraticCurveTo(p[i], p[i+1], (p[i] + p[i+2]) / 2, (p[i+1] + p[i+3]) / 2);
      g.lineTo(p[p.length-2], p[p.length-1]);
      g.stroke();
    }
    g.restore();
  }

  /* ---- live drawing: draws the same curve as paintStroke, piece by piece as points arrive ----
     live = { fx, fy: smoothed pen position; ex, ey: where the drawn line ends; k: points drawn so far } */
  function liveStart(x, y){ return { fx: x, fy: y, ex: x, ey: y, k: 1 }; }

  /* add one raw sample through the smoothing filter (level 0-8). Returns true if a point was kept. */
  function liveAdd(s, live, x, y, level){
    var k = level / 10, n = s.p.length;
    live.fx = live.fx * k + x * (1 - k);
    live.fy = live.fy * k + y * (1 - k);
    var px = Math.round(live.fx * 10) / 10, py = Math.round(live.fy * 10) / 10;
    if (Math.abs(px - s.p[n-2]) + Math.abs(py - s.p[n-1]) < 0.5) return false;
    s.p.push(px, py);
    return true;
  }

  /* pieces not drawn yet: [x0,y0,cx,cy,x1,y1] (cx null = straight line) */
  function livePieces(s, live){
    var p = s.p, n = p.length / 2, pieces = [];
    while (live.k < n) {
      var k = live.k;
      if (k >= 2) {
        var bx = p[2*k-2], by = p[2*k-1], mx = (bx + p[2*k]) / 2, my = (by + p[2*k+1]) / 2;
        pieces.push([live.ex, live.ey, bx, by, mx, my]);
        live.ex = mx; live.ey = my;
      }
      live.k++;
    }
    return pieces;
  }

  /* the last straight bit to where the pen lifted; call once at the end of a stroke */
  function liveEndPieces(s, live){
    var p = s.p, n = p.length;
    if (n < 4) return [];
    var pieces = livePieces(s, live);
    pieces.push([live.ex, live.ey, null, null, p[n-2], p[n-1]]);
    return pieces;
  }

  function paintPieces(g, s, pieces, sc, ox, oy){
    if (!pieces.length) return;
    g.save(); inkStyle(g, s, sc, ox, oy);
    for (var i = 0; i < pieces.length; i++) {
      var q = pieces[i];
      g.beginPath(); g.moveTo(q[0], q[1]);
      if (q[2] === null) g.lineTo(q[4], q[5]); else g.quadraticCurveTo(q[2], q[3], q[4], q[5]);
      g.stroke();
    }
    g.restore();
  }

  /* finish the stroke where the pen lifted (smoothing trails slightly behind) */
  function liveLift(s, x, y){
    var n = s.p.length;
    if (n >= 4 && Math.abs(x - s.p[n-2]) + Math.abs(y - s.p[n-1]) >= 0.5) s.p.push(x, y);
  }

  /* ---- toolbar helpers ---- */

  /* - / + buttons: tap = one step; hold = keeps stepping, speeding up, until step() returns false */
  function holdRepeat(b, step){
    var timer = null;
    function stop(){ clearTimeout(timer); timer = null; }
    b.addEventListener('pointerdown', function(e){
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault(); stop();
      try { b.setPointerCapture(e.pointerId); } catch(_){}
      step();
      var delay = 160, n = 0;
      timer = setTimeout(function tick(){
        if (!step()) return stop();               // stop at the end of the range
        n++; if (n === 6) delay = 80;             // speed up after a few steps
        timer = setTimeout(tick, delay);
      }, 450);                                    // hold this long before it starts repeating
    });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function(t){ b.addEventListener(t, stop); });
    b.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  }

  /* first tap arms ("Sure?"), second tap within 3s does it */
  function confirmTap(btn, fn, sure){
    if (!btn.classList.contains('warn')) {
      btn._label = btn.textContent; btn.classList.add('warn'); btn.textContent = sure || 'Sure?';
      btn._timer = setTimeout(function(){ btn.classList.remove('warn'); btn.textContent = btn._label; }, 3000);
      return;
    }
    clearTimeout(btn._timer); btn.classList.remove('warn'); btn.textContent = btn._label; fn();
  }

  /* show a result on the button itself, then put the label back */
  function flashBtn(btn, text, cls){
    clearTimeout(btn._flash); btn.classList.remove('good', 'warn');
    if (!btn._label) btn._label = btn.textContent;
    btn.textContent = text; btn.classList.add(cls);
    btn._flash = setTimeout(function(){ btn.classList.remove(cls); btn.textContent = btn._label; }, 3000);
  }

  /* ---- Highlighter ▾ menu: Highlight (with a strength slider) or Cover ---- */

  /* highlights go on the multiply layer under the ink; covers (o: 1) and pen ink go on the top layer */
  function seeThrough(s){ return !!s.h && !s.o; }

  /* highlight color at a strength in % (10-100): mixed toward white. It multiplies, so printed text stays black. */
  function hlInk(color, strength){ return tint(color, 1 - strength / 100); }

  /* The five color swatches change with the tool: pen colors you can read, highlighter colors that are light
     enough to read through, and cover colors. [color, strings.js key for its name, English name] */
  function paletteColors(mode){
    if (mode === 'hl') return [['#fdd835', 'yellow', 'Yellow'], ['#2e7d32', 'green', 'Green'], ['#e0218a', 'pink', 'Barbie pink'], ['#1565c0', 'blue', 'Blue'], ['#e8441a', 'orange', 'Sunset orange']];
    if (mode === 'cover') return [['#111111', 'cover_black', 'Cover: black'], ['#a6a6a6', 'cover_light', 'Cover: light gray'], ['#ffffff', 'cover_white', 'Cover: white'], ['#fdd835', 'cover_yellow', 'Cover: yellow'], ['#e0218a', 'cover_pink', 'Cover: pink']];
    return [['#111111', 'black', 'Black'], ['#1565c0', 'blue', 'Blue'], ['#d32f2f', 'red', 'Red'], ['#e0218a', 'pink', 'Barbie pink'], ['#2e7d32', 'green', 'Green']];
  }
  /* show the swatches for mode ('pen', 'hl' or 'cover') in the toolbar; t (optional) is the translator */
  function setPalette(bar, mode, t){
    var box = bar.querySelector('#ink-colors'); if (!box || box.dataset.mode === mode && !t) return;
    var bs = box.querySelectorAll('[data-color]'), cs = paletteColors(mode);
    box.dataset.mode = mode;
    for (var i = 0; i < bs.length && i < cs.length; i++) {
      var b = bs[i], c = cs[i], name = t ? t(c[1]) : c[2];
      b.dataset.color = c[0]; b.style.background = c[0];
      b.setAttribute('data-ta', c[1]); b.setAttribute('data-tt', c[1]);
      b.setAttribute('aria-label', name); b.title = name;
    }
  }

  /* put a popout beside the toolbar, next to btn (alignTop: tops line up; otherwise bottoms) */
  function placeMenu(menu, btn, bar, alignTop){
    var r = btn.getBoundingClientRect(), b = bar.getBoundingClientRect(), m = menu.getBoundingClientRect();
    var k = menu.offsetWidth ? m.width / menu.offsetWidth : 1, h = m.height;   // the menu may be zoomed (fitTools): its px are k screen px
    menu.style.top = Math.max(10, Math.min(alignTop ? r.top : r.bottom - h, innerHeight - h - 10)) / k + 'px';
    if (bar.classList.contains('right')) { menu.style.left = ''; menu.style.right = (innerWidth - b.left + 8) / k + 'px'; }
    else { menu.style.right = ''; menu.style.left = (b.right + 8) / k + 'px'; }
  }

  /* The ▾ beside the Highlighter button opens this menu. It stays open until a choice is tapped, a tap lands
     anywhere else, or Escape; lifting the pen or finger never closes it (no long-press: nobody finds one, and
     the SMART driver holds back a finger that stays still). The slider isn't a final choice, so it keeps it open.
     S: { covering, coverColor, hlStrength, hlColor }. The menu changes S, then calls onPick() so the caller
     turns the highlighter on, saves the settings and refreshes. onOpen() closes the caller's other popouts.
     Returns { el, show(open), sync() }. */
  function makeHlMenu(bar, S, onPick, onOpen){
    var btn = bar.querySelector('[data-act="hl-menu"]');
    // the last one opens the color picker (the toolbar's own), for a cover in any color
    var covers = [['#111111', 'Cover: black', 'cover_black'], ['#a6a6a6', 'Cover: light gray', 'cover_light'], ['#ffffff', 'Cover: white', 'cover_white'], ['pick', 'Cover: any color…', 'cover_any']];
    var m = document.createElement('div');
    m.id = 'ob-hlmenu'; m.setAttribute('role', 'menu'); m.setAttribute('aria-label', 'Highlighter'); m.setAttribute('data-ta', 'highlighter'); m.hidden = true;
    // data-t / data-ta: words translated by obTranslate (shared/strings.js)
    var html = '<button data-mode="hl"><span class="sw hl"></span><span data-t="highlight">Highlight</span><small data-t="see_through">see-through</small></button>' +
      '<label class="strength"><span><span data-t="hl_strength">Highlight strength</span> <b id="ob-hl-pct"></b></span>' +
      '<input type="range" id="ob-hl-strength" min="10" max="100" step="5" aria-label="Highlight strength" data-ta="hl_strength"></label>';
    for (var i = 0; i < covers.length; i++)
      html += '<button data-mode="cover" data-cover="' + covers[i][0] + '"><span class="sw' + (covers[i][0] === 'pick' ? ' pick"' : '" style="background:' + covers[i][0] + '"') + '></span>' +
        '<span data-t="' + covers[i][2] + '">' + covers[i][1] + '</span><small data-t="hides_answers">hides answers</small></button>';
    m.innerHTML = html;
    document.body.appendChild(m);
    var slider = m.querySelector('input'), pct = m.querySelector('b');
    function show(open){
      m.hidden = !open;
      btn.setAttribute('aria-expanded', String(open));
      if (open) { if (onOpen) onOpen(); placeMenu(m, btn, bar, true); }
    }
    function sync(){
      slider.value = S.hlStrength; pct.textContent = S.hlStrength + '%';
      slider.style.setProperty('--fill', hlInk(S.hlColor, S.hlStrength));
      var bs = m.querySelectorAll('button');
      var fixed = covers.map(function(c){ return c[0]; });
      for (var i = 0; i < bs.length; i++) {
        var c = bs[i].dataset.cover;
        bs[i].classList.toggle('on', bs[i].dataset.mode === 'cover' ? S.covering && (c === S.coverColor || (c === 'pick' && fixed.indexOf(S.coverColor) < 0)) : !S.covering);
      }
    }
    btn.addEventListener('click', function(){ show(m.hidden); });
    m.addEventListener('click', function(e){
      var b = e.target.closest('button'); if (!b) return;
      S.covering = b.dataset.mode === 'cover';
      var pick = b.dataset.cover === 'pick', picker = bar.querySelector('#ink-picker');
      if (S.covering && !pick) S.coverColor = b.dataset.cover;
      show(false); onPick();
      if (pick && picker) {   // a picked color becomes the cover's color (the toolbar's picker handles it while covering)
        picker.value = S.coverColor;
        try { if (picker.showPicker) picker.showPicker(); else picker.click(); } catch(_){ picker.click(); }
      }
    });
    slider.addEventListener('input', function(){ S.hlStrength = +slider.value; S.covering = false; onPick(); });
    document.addEventListener('pointerdown', function(e){ if (!m.hidden && !m.contains(e.target) && !btn.contains(e.target)) show(false); }, true);
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !m.hidden) show(false); });
    return { el: m, show: show, sync: sync };
  }

  /* A popout menu beside the toolbar (File ▸, Clear ▸), the same in the PDF app and the overlay. It opens on a
     tap of its button and stays open until a choice, a tap anywhere else, or Escape. onOpen() closes the
     caller's other popouts. Returns { el, show(open), place() }. */
  function makePopMenu(menu, btn, bar, onOpen){
    function place(){ placeMenu(menu, btn, bar, false); }
    function show(open){
      menu.hidden = !open; btn.setAttribute('aria-expanded', String(open));
      if (open) { if (onOpen) onOpen(); place(); }
    }
    document.addEventListener('pointerdown', function(e){
      if (!menu.hidden && !menu.contains(e.target) && !btn.contains(e.target)) show(false);
    }, true);
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape') show(false); });
    return { el: menu, show: show, place: place };
  }

  /* A word that is too wide for its button (longer languages: "Desplazar", "Défiler") gets smaller text,
     down to 10px, instead of stretching the toolbar. Call after the words or the layout change. */
  function fitLabels(root){
    var bs = root.querySelectorAll('button');
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      b.style.fontSize = '';
      if (!b.offsetParent || !b.textContent.trim()) continue;
      var px = parseFloat(getComputedStyle(b).fontSize);
      while (b.scrollWidth > b.clientWidth && px > 10) { px -= 1; b.style.fontSize = px + 'px'; }
    }
  }

  /* Shrink the toolbar (and its popouts) to fit a short window, such as a laptop screen, instead of making it
     scroll. base is the zoom that shows them at normal size: 1, or 1/Z in the overlay while the page is zoomed.
     Call it after the window, the zoom or the toolbar's contents change. Returns the scale used (1 = full size). */
  function fitTools(bar, popouts, base){
    var els = [bar].concat(popouts.filter(Boolean)), s = 1;
    els.forEach(function(el){ el.style.zoom = base === 1 ? '' : String(base); });
    fitLabels(bar);   // at full size, so rounding at a smaller zoom can't hide a word that's a pixel too wide
    bar.style.maxHeight = 'none';
    if (bar.hidden || bar.style.display === 'none') { bar.style.maxHeight = ''; return 1; }
    var room = Math.floor(innerHeight * 0.96) - 1;   // whole pixels, with 1px to spare: a toolbar a fraction of a pixel too tall would scroll
    for (var i = 0; i < 2; i++) {   // text doesn't shrink exactly in proportion, so check once more after scaling
      var h = bar.getBoundingClientRect().height;
      if (h <= room && i === 0) break;
      s = Math.min(1, s * room / h);
      els.forEach(function(el){ el.style.zoom = String(base * s); });
    }
    if (s >= 0.999) bar.style.maxHeight = '';
    return s;
  }

  /* ---- class periods and File ▸ Settings…, the same in the PDF app and the overlay ----
     Saved per browser (localStorage), so every worksheet and PDF opened in this browser shares them. */

  /* tap-only name styles for n periods */
  function periodPreset(style, n){
    var out = [], half = Math.ceil(n / 2);
    for (var i = 0; i < n; i++) {
      if (style === 'period') out.push('Period ' + (i + 1));
      else if (style === 'block') out.push('Block ' + String.fromCharCode(65 + i));
      else if (style === 'ab') out.push(i < half ? 'A' + (i + 1) : 'B' + (i - half + 1));   // A/B day schedules
      else out.push('P' + (i + 1));
    }
    return out;
  }
  function periodStyles(){ return [['p', 'P1, P2…'], ['period', 'Period 1, 2…'], ['block', 'Block A, B…'], ['ab', 'A1… B1… (A/B days)']]; }

  /* trimmed, not empty, all different, at most 20 characters; null if the list can't be used */
  function cleanPeriods(list){
    if (!list || !list.length || list.length > 12) return null;
    var seen = {}, out = [];
    for (var i = 0; i < list.length; i++) {
      var n = String(list[i] == null ? '' : list[i]).replace(/\s+/g, ' ').trim().slice(0, 20), k = n.toLowerCase();
      if (!n || seen[k]) return null;
      seen[k] = 1; out.push(n);
    }
    return out;
  }
  /* the period list new documents start with (def until the teacher sets one) */
  function loadPeriods(def){
    try { return cleanPeriods(JSON.parse(localStorage.getItem('ob-periods'))) || def.slice(); } catch(e){ return def.slice(); }
  }
  /* the pen color each document starts with */
  function startPen(def){
    var c = null; try { c = localStorage.getItem('ob-pen-color'); } catch(e){}
    return /^#[0-9a-f]{6}$/i.test(c || '') ? c : def;
  }

  /* Give a document a new period list. Names replace the document's periods in order, keeping their ink
     (so renaming never loses ink); periods past the end of the list are removed. Returns
     { periods, active, lost, same }: lost = removed periods that had ink; same = nothing would change. */
  function remapPeriods(periods, active, names){
    var old = Object.keys(periods), out = {}, lost = [], act = names[0], i;
    for (i = 0; i < names.length; i++) {
      out[names[i]] = i < old.length ? periods[old[i]] : [];
      if (i < old.length && old[i] === active) act = names[i];
    }
    for (i = names.length; i < old.length; i++) if (periods[old[i]].length) lost.push(old[i]);
    return { periods: out, active: act, lost: lost, same: old.join('\n') === names.join('\n') };
  }

  /* The Class period row on the toolbar: one button per period when they fit (up to 4 short names), otherwise
     one wide "P5 ▾" button that opens a list beside the toolbar. Period buttons carry data-period, so the
     toolbar's own click handler switches; buttons in the list call onPick(name). onOpen() closes other popouts.
     t (optional) is the translator from shared/strings.js. Returns { el, render(names, active), show(open) }. */
  function makePeriodPicker(bar, row, onPick, onOpen, t){
    var m = document.createElement('div'), toggle = null;
    m.id = 'ob-permenu'; m.setAttribute('role', 'menu'); m.setAttribute('aria-label', 'Class period'); m.hidden = true;
    document.body.appendChild(m);
    function show(open){
      if (open && !toggle) return;
      m.hidden = !open;
      if (toggle) toggle.setAttribute('aria-expanded', String(open));
      if (open) { if (onOpen) onOpen(); placeMenu(m, toggle, bar, true); }
    }
    function periodBtn(name, on){
      var b = document.createElement('button');
      b.className = 'sm' + (on ? ' on' : ''); b.dataset.period = name; b.textContent = name; b.title = name;
      return b;
    }
    function render(names, active){
      row.textContent = ''; m.textContent = ''; toggle = null;
      var fits = names.length <= 4;
      for (var i = 0; i < names.length; i++) if (names[i].length > 4) fits = false;
      row.classList.toggle('menu', !fits);
      row.style.gridTemplateColumns = fits ? 'repeat(' + names.length + ',1fr)' : '';
      if (fits) {
        for (i = 0; i < names.length; i++) row.appendChild(periodBtn(names[i], names[i] === active));
        m.hidden = true;
        return;
      }
      toggle = document.createElement('button');
      toggle.className = 'sm'; toggle.dataset.act = 'period-menu';
      toggle.setAttribute('aria-haspopup', 'true'); toggle.setAttribute('aria-expanded', String(!m.hidden));
      toggle.textContent = active + ' ▾'; toggle.title = t ? t('period_menu_tip', { p: active }) : 'Class period: ' + active + ' (tap to change)';
      row.appendChild(toggle);

  function historyKey(e) {

      "st_needs_chrome": ["Save ink into file needs Chrome or Edge. Ink still saves in this browser.", "Guardar tinta en el archivo necesita Chrome o Edge. La tinta se sigue guardando en este navegador.", "“把笔迹保存到文件”需要 Chrome 或 Edge。笔迹仍会保存在此浏览器中。", "Kailangan ng Chrome o Edge para sa I-save ang tinta sa file. Nase-save pa rin ang tinta sa browser na ito.", "Lưu nét mực vào tệp cần Chrome hoặc Edge. Nét mực vẫn được lưu trong trình duyệt này.", "Enregistrer l'encre dans le fichier nécessite Chrome ou Edge. L'encre reste enregistrée dans ce navigateur.", "Salvar tinta no arquivo precisa do Chrome ou do Edge. A tinta continua salva neste navegador.", "حفظ الحبر في الملف يحتاج إلى Chrome أو Edge. لا يزال الحبر يُحفظ في هذا المتصفح."],

      "confirm_covers_ws": ["Covered answers are hidden in the PDF, but the text under the covers is still in it (and in this worksheet file), so anyone with the file can copy it.\n\nTo hand out a copy with the answers truly gone, print it on paper.\n\nSave the PDF anyway?", "Las respuestas tapadas no se ven en el PDF, pero el texto bajo las tapas sigue ahí (y en este archivo), así que cualquiera con el archivo puede copiarlo.\n\nPara repartir una copia sin las respuestas, imprímela en papel.\n\n¿Guardar el PDF de todos modos?", "被遮盖的答案在 PDF 中看不见，但遮盖下面的文字仍然在文件里（也在这个练习页文件里），拿到文件的人都能复制。\n\n要发一份真正没有答案的版本，请打印在纸上。\n\n仍然保存 PDF 吗？", "Nakatago ang mga natakpang sagot sa PDF, pero nandoon pa rin ang teksto sa ilalim ng takip (at sa worksheet file na ito), kaya makokopya ito ng sinumang may file.\n\nPara mamigay ng kopyang talagang walang sagot, i-print ito sa papel.\n\nI-save pa rin ang PDF?", "Đáp án bị che sẽ không hiện trong PDF, nhưng chữ bên dưới vẫn còn trong tệp (và trong tệp bài tập này), nên ai có tệp cũng sao chép được.\n\nĐể phát bản thật sự không có đáp án, hãy in ra giấy.\n\nVẫn lưu PDF?", "Les réponses cachées ne se voient pas dans le PDF, mais le texte sous les caches y est toujours (et dans ce fichier), donc toute personne qui a le fichier peut le copier.\n\nPour distribuer une copie vraiment sans les réponses, imprimez-la sur papier.\n\nEnregistrer le PDF quand même ?", "As respostas cobertas ficam escondidas no PDF, mas o texto embaixo das coberturas continua nele (e neste arquivo), então quem tiver o arquivo pode copiá-lo.\n\nPara entregar uma cópia realmente sem as respostas, imprima em papel.\n\nSalvar o PDF mesmo assim?", "الإجابات المغطاة مخفية في ملف PDF، لكن النص تحت الأغطية لا يزال موجودًا فيه (وفي ملف ورقة العمل هذا)، لذا يمكن لأي شخص لديه الملف نسخه.\n\nلتوزيع نسخة بلا إجابات فعلًا، اطبعها على الورق.\n\nهل تحفظ ملف PDF على أي حال؟"],

      "start_lead": ["Write on any PDF on your smartboard: a worksheet or a whole textbook.", "Escribe sobre cualquier PDF en tu pizarra digital: una hoja de trabajo o un libro entero.", "在智能白板上的任何 PDF 上书写：练习页或整本课本都可以。", "Sumulat sa kahit anong PDF sa smartboard mo: worksheet man o buong textbook.", "Viết lên bất kỳ PDF nào trên bảng thông minh: một trang bài tập hay cả cuốn sách.", "Écrivez sur n'importe quel PDF sur votre tableau interactif : une feuille d'exercices ou un manuel entier.", "Escreva em qualquer PDF na sua lousa digital: uma folha de atividades ou um livro inteiro.", "اكتب على أي ملف PDF على سبورتك الذكية: ورقة عمل أو كتاب مدرسي كامل."],

      "drop_sub": ["or an HTML worksheet, or tap to choose a file", "o una hoja HTML, o toca para elegir un archivo", "或 HTML 练习页，或点按选择文件", "o HTML worksheet, o i-tap para pumili ng file", "hoặc bài tập HTML, hoặc chạm để chọn tệp", "ou une feuille HTML, ou touchez pour choisir un fichier", "ou uma folha HTML, ou toque para escolher um arquivo", "أو ورقة عمل HTML، أو اضغط لاختيار ملف"],
      "install_app": ["Install app", "Instalar app", "安装应用", "I-install ang app", "Cài ứng dụng", "Installer l'app", "Instalar app", "تثبيت التطبيق"],
      "install_note": ["Opens in its own window like any app, and works without internet.", "Se abre en su propia ventana como cualquier app y funciona sin internet.", "像普通应用一样在独立窗口中打开，没有网络也能用。", "Bumubukas sa sarili nitong window gaya ng ibang app, at gumagana kahit walang internet.", "Mở trong cửa sổ riêng như mọi ứng dụng, và chạy được khi không có mạng.", "S'ouvre dans sa propre fenêtre comme une app, et fonctionne sans internet.", "Abre em sua própria janela como qualquer app e funciona sem internet.", "يفتح في نافذته الخاصة مثل أي تطبيق، ويعمل بدون إنترنت."],
      "open_again": ["Open again", "Abrir de nuevo", "再次打开", "Buksan ulit", "Mở lại", "Rouvrir", "Abrir de novo", "افتح مرة أخرى"],
      "start_note": ["Your PDF and your ink stay in this browser on this computer. Nothing is uploaded. Have a Word file? In Word, choose File → Save as PDF, then drop the PDF here. Have an HTML worksheet? Drop it here to get a <i>_board.html</i> copy you can write on.", "Tu PDF y tu tinta se quedan en este navegador, en esta computadora. No se sube nada. ¿Tienes un archivo de Word? En Word, elige Archivo → Guardar como PDF y suelta el PDF aquí. ¿Tienes una hoja HTML? Suéltala aquí para obtener una copia <i>_board.html</i> en la que puedes escribir.", "你的 PDF 和笔迹只保存在这台电脑的浏览器里，不会上传任何内容。有 Word 文件？在 Word 中选择“文件 → 另存为 PDF”，再把 PDF 拖到这里。有 HTML 练习页？拖到这里即可得到一个可书写的 <i>_board.html</i> 副本。", "Nananatili ang PDF at tinta mo sa browser ng computer na ito. Walang ina-upload. May Word file ka? Sa Word, piliin ang File → Save as PDF, saka i-drop dito ang PDF. May HTML worksheet ka? I-drop ito rito para makakuha ng kopyang <i>_board.html</i> na masusulatan mo.", "PDF và nét mực của bạn chỉ nằm trong trình duyệt trên máy này. Không tải gì lên mạng. Có tệp Word? Trong Word, chọn Tệp → Lưu thành PDF, rồi thả PDF vào đây. Có bài tập HTML? Thả vào đây để có bản <i>_board.html</i> viết lên được.", "Votre PDF et votre encre restent dans ce navigateur, sur cet ordinateur. Rien n'est envoyé en ligne. Un fichier Word ? Dans Word, choisissez Fichier → Enregistrer au format PDF, puis déposez le PDF ici. Une feuille HTML ? Déposez-la ici pour obtenir une copie <i>_board.html</i> sur laquelle écrire.", "Seu PDF e sua tinta ficam neste navegador, neste computador. Nada é enviado. Tem um arquivo do Word? No Word, escolha Arquivo → Salvar como PDF e solte o PDF aqui. Tem uma folha HTML? Solte aqui para receber uma cópia <i>_board.html</i> em que dá para escrever.", "يبقى ملف PDF والحبر في هذا المتصفح على هذا الكمبيوتر. لا يُرفع أي شيء. لديك ملف Word؟ في Word اختر ملف ← حفظ بتنسيق PDF، ثم أفلت ملف PDF هنا. لديك ورقة عمل HTML؟ أفلتها هنا لتحصل على نسخة <i>_board.html</i> يمكنك الكتابة عليها."],
      "back_demo": ["Back to the HTML worksheet demo", "Volver a la demo de hoja HTML", "返回 HTML 练习页演示", "Bumalik sa HTML worksheet demo", "Quay lại bản demo bài tập HTML", "Retour à la démo de feuille HTML", "Voltar à demonstração da folha HTML", "العودة إلى عرض ورقة عمل HTML"],
      "about": ["About OverBoard", "Acerca de OverBoard", "关于 OverBoard", "Tungkol sa OverBoard", "Giới thiệu OverBoard", "À propos d'OverBoard", "Sobre o OverBoard", "حول OverBoard"],
      "embed_h": ["Keep the ink inside a PDF file?", "¿Guardar la tinta dentro de un archivo PDF?", "把笔迹保存在 PDF 文件内？", "Itago ang tinta sa loob ng PDF file?", "Giữ nét mực bên trong tệp PDF?", "Garder l'encre dans un fichier PDF ?", "Guardar a tinta dentro de um arquivo PDF?", "هل تحتفظ بالحبر داخل ملف PDF؟"],
      "embed_1": ["OverBoard saves a PDF on this computer with <b>all class periods' ink</b> stored inside it.", "OverBoard guarda un PDF en esta computadora con <b>la tinta de todas las clases</b> dentro.", "OverBoard 会在这台电脑上保存一个 PDF，里面存有<b>所有班级的笔迹</b>。", "Magse-save ang OverBoard ng PDF sa computer na ito na may <b>tinta ng lahat ng klase</b> sa loob.", "OverBoard lưu một PDF trên máy này, bên trong có <b>nét mực của mọi lớp</b>.", "OverBoard enregistre sur cet ordinateur un PDF qui contient <b>l'encre de toutes les classes</b>.", "O OverBoard salva neste computador um PDF com <b>a tinta de todas as turmas</b> dentro.", "يحفظ OverBoard ملف PDF على هذا الكمبيوتر يحتوي على <b>حبر كل الحصص</b>."],
      "embed_2": ["<b>Your pages are not changed.</b> The ink is added at the end of the file. Preview, Acrobat and Chrome show the plain PDF.", "<b>Tus páginas no cambian.</b> La tinta se añade al final del archivo. Vista Previa, Acrobat y Chrome muestran el PDF normal.", "<b>页面本身不会改变。</b>笔迹被添加在文件末尾。预览、Acrobat 和 Chrome 显示的是原始 PDF。", "<b>Hindi binabago ang mga pahina mo.</b> Idinadagdag ang tinta sa dulo ng file. Ang Preview, Acrobat at Chrome ay nagpapakita ng karaniwang PDF.", "<b>Các trang của bạn không bị thay đổi.</b> Nét mực được thêm vào cuối tệp. Preview, Acrobat và Chrome vẫn hiện PDF gốc.", "<b>Vos pages ne changent pas.</b> L'encre est ajoutée à la fin du fichier. Aperçu, Acrobat et Chrome affichent le PDF normal.", "<b>Suas páginas não mudam.</b> A tinta é adicionada no fim do arquivo. Pré-Visualização, Acrobat e Chrome mostram o PDF comum.", "<b>صفحاتك لا تتغير.</b> يُضاف الحبر في نهاية الملف. يعرض Preview وAcrobat وChrome ملف PDF العادي."],
      "embed_3": ["Open that file in OverBoard on any computer and the ink comes back, ready to keep writing.", "Abre ese archivo en OverBoard en cualquier computadora y la tinta vuelve, lista para seguir escribiendo.", "在任何电脑上用 OverBoard 打开该文件，笔迹都会回来，可以继续书写。", "Buksan ang file na iyon sa OverBoard sa kahit anong computer at babalik ang tinta, handa nang sulatan ulit.", "Mở tệp đó bằng OverBoard trên bất kỳ máy nào và nét mực sẽ hiện lại, sẵn sàng viết tiếp.", "Ouvrez ce fichier dans OverBoard sur n'importe quel ordinateur et l'encre revient, prête pour continuer.", "Abra esse arquivo no OverBoard em qualquer computador e a tinta volta, pronta para continuar escrevendo.", "افتح هذا الملف في OverBoard على أي كمبيوتر وسيعود الحبر، جاهزًا لمواصلة الكتابة."],
      "embed_4": ["While this is on, every change is saved into that file a few seconds after you stop writing. Tap the same button to turn it off.", "Mientras esté activo, cada cambio se guarda en ese archivo unos segundos después de que dejes de escribir. Toca el mismo botón para desactivarlo.", "开启期间，你停笔几秒后每次改动都会保存到该文件。再点同一个按钮即可关闭。", "Habang naka-on ito, sine-save ang bawat pagbabago sa file na iyon ilang segundo matapos kang tumigil sa pagsulat. I-tap ang parehong button para i-off.", "Khi bật, mọi thay đổi được lưu vào tệp đó vài giây sau khi bạn ngừng viết. Chạm cùng nút để tắt.", "Tant que c'est activé, chaque modification est enregistrée dans ce fichier quelques secondes après que vous arrêtez d'écrire. Touchez le même bouton pour arrêter.", "Enquanto estiver ligado, cada mudança é salva nesse arquivo alguns segundos depois que você para de escrever. Toque no mesmo botão para desligar.", "أثناء التشغيل، يُحفظ كل تغيير في ذلك الملف بعد ثوانٍ من توقفك عن الكتابة. اضغط الزر نفسه لإيقافه."],
      "embed_5": ["We suggest a new file, <b class=\"name\">Name_board.pdf</b>. If you choose the original PDF instead, OverBoard adds the ink to the original.", "Te sugerimos un archivo nuevo, <b class=\"name\">Name_board.pdf</b>. Si eliges el PDF original, OverBoard añade la tinta al original.", "建议新建一个文件 <b class=\"name\">Name_board.pdf</b>。如果你选择原始 PDF，OverBoard 会把笔迹添加到原文件中。", "Mungkahi namin ang bagong file, <b class=\"name\">Name_board.pdf</b>. Kung ang orihinal na PDF ang pipiliin mo, idadagdag ng OverBoard ang tinta sa orihinal.", "Nên dùng tệp mới, <b class=\"name\">Name_board.pdf</b>. Nếu bạn chọn PDF gốc, OverBoard sẽ thêm nét mực vào tệp gốc.", "Nous suggérons un nouveau fichier, <b class=\"name\">Name_board.pdf</b>. Si vous choisissez le PDF original, OverBoard ajoute l'encre à l'original.", "Sugerimos um arquivo novo, <b class=\"name\">Name_board.pdf</b>. Se escolher o PDF original, o OverBoard adiciona a tinta ao original.", "نقترح ملفًا جديدًا، <b class=\"name\">Name_board.pdf</b>. إذا اخترت ملف PDF الأصلي، يضيف OverBoard الحبر إلى الأصل."],
      "embed_6": ["This browser can't keep saving into a file, so you get a one-time download, <b class=\"name\">Name_board.pdf</b>. Chrome or Edge can keep it saved automatically.", "Este navegador no puede seguir guardando en un archivo, así que recibes una descarga única, <b class=\"name\">Name_board.pdf</b>. Chrome o Edge pueden mantenerlo guardado automáticamente.", "此浏览器无法持续保存到文件，所以你会得到一次性下载的 <b class=\"name\">Name_board.pdf</b>。Chrome 或 Edge 可以自动保持保存。", "Hindi kayang patuloy na mag-save sa file ng browser na ito, kaya isang beses mo itong mada-download, <b class=\"name\">Name_board.pdf</b>. Kaya ng Chrome o Edge na awtomatikong i-save ito.", "Trình duyệt này không thể lưu liên tục vào tệp, nên bạn sẽ tải về một lần, <b class=\"name\">Name_board.pdf</b>. Chrome hoặc Edge có thể tự động lưu liên tục.", "Ce navigateur ne peut pas continuer à enregistrer dans un fichier : vous obtenez un téléchargement unique, <b class=\"name\">Name_board.pdf</b>. Chrome ou Edge peuvent l'enregistrer automatiquement.", "Este navegador não consegue continuar salvando num arquivo, então você recebe um download único, <b class=\"name\">Name_board.pdf</b>. O Chrome ou o Edge podem manter salvo automaticamente.", "لا يستطيع هذا المتصفح مواصلة الحفظ في ملف، لذا ستحصل على تنزيل لمرة واحدة، <b class=\"name\">Name_board.pdf</b>. يمكن لـ Chrome أو Edge الحفظ تلقائيًا."],
      "embed_off": ["Leave it off and nothing changes: ink still saves in this browser.", "Si lo dejas desactivado, nada cambia: la tinta se sigue guardando en este navegador.", "保持关闭则一切照旧：笔迹仍保存在此浏览器中。", "Kapag naka-off, walang magbabago: nase-save pa rin ang tinta sa browser na ito.", "Để tắt thì không có gì thay đổi: nét mực vẫn được lưu trong trình duyệt này.", "Laissez désactivé et rien ne change : l'encre reste enregistrée dans ce navigateur.", "Deixe desligado e nada muda: a tinta continua salva neste navegador.", "اتركه متوقفًا ولن يتغير شيء: لا يزال الحبر يُحفظ في هذا المتصفح."],

      "timer_drag": ["Drag to move the timer. When it's small, tap to make it big.", "Arrastra para mover el temporizador. Si está pequeño, tócalo para agrandarlo.", "拖动可移动计时器。缩小时点一下可放大。", "I-drag para ilipat ang timer. Kapag maliit, i-tap para lumaki.", "Kéo để di chuyển đồng hồ. Khi đang nhỏ, chạm để phóng to.", "Faites glisser pour déplacer le minuteur. S'il est petit, touchez-le pour l'agrandir.", "Arraste para mover o temporizador. Se estiver pequeno, toque para aumentar.", "اسحب لتحريك المؤقت. عندما يكون صغيرًا، المسه ليكبر."],

      "sound_hint": ["Your own sound: a .wav or .mp3 file, up to 5 MB. It stays in this browser.", "Tu propio sonido: un archivo .wav o .mp3 de hasta 5 MB. Se queda en este navegador.", "你自己的声音：.wav 或 .mp3 文件，最大 5 MB。只保存在这个浏览器里。", "Sariling tunog: .wav o .mp3 na file, hanggang 5 MB. Mananatili ito sa browser na ito.", "Âm thanh của bạn: tệp .wav hoặc .mp3, tối đa 5 MB. Chỉ lưu trong trình duyệt này.", "Votre propre son : un fichier .wav ou .mp3, 5 Mo maximum. Il reste dans ce navigateur.", "Seu próprio som: um arquivo .wav ou .mp3 de até 5 MB. Ele fica neste navegador.", "صوتك الخاص: ملف ‎.wav أو ‎.mp3 حتى 5 ميغابايت. يبقى في هذا المتصفح."],
      "sound_too_big": ["That file is over 5 MB. Pick a shorter sound.", "Ese archivo pasa de 5 MB. Elige un sonido más corto.", "这个文件超过 5 MB。请选一个更短的声音。", "Lampas 5 MB ang file na iyan. Pumili ng mas maikling tunog.", "Tệp đó lớn hơn 5 MB. Hãy chọn âm thanh ngắn hơn.", "Ce fichier dépasse 5 Mo. Choisissez un son plus court.", "Esse arquivo tem mais de 5 MB. Escolha um som mais curto.", "هذا الملف أكبر من 5 ميغابايت. اختر صوتًا أقصر."],

      "cover_pink": ["Cover: pink", "Tapar: rosa", "遮盖：粉色", "Takip: rosas", "Che: hồng", "Cacher : rose", "Cobrir: rosa", "تغطية: وردي"],

      "cw_h": ["Covered answers can still be copied from this PDF", "Las respuestas tapadas aún se pueden copiar de este PDF", "被遮盖的答案仍可从此 PDF 中复制", "Makokopya pa rin sa PDF na ito ang mga natakpang sagot", "Đáp án bị che vẫn có thể sao chép từ PDF này", "Les réponses cachées peuvent encore être copiées depuis ce PDF", "As respostas cobertas ainda podem ser copiadas deste PDF", "لا يزال من الممكن نسخ الإجابات المغطاة من ملف PDF هذا"],
      "cw_1": ["The covers look the same in the PDF: answers are hidden on screen and on paper.", "Las tapas se ven igual en el PDF: las respuestas quedan ocultas en pantalla y en papel.", "遮盖在 PDF 中看起来一样：答案在屏幕上和纸上都看不见。", "Pareho ang hitsura ng mga takip sa PDF: nakatago ang mga sagot sa screen at sa papel.", "Phần che trong PDF trông giống hệt: đáp án bị giấu trên màn hình và trên giấy.", "Les caches sont identiques dans le PDF : les réponses sont cachées à l'écran et sur papier.", "As coberturas ficam iguais no PDF: as respostas ficam escondidas na tela e no papel.", "تبدو الأغطية كما هي في ملف PDF: الإجابات مخفية على الشاشة وعلى الورق."],
      "cw_2": ["<b>But the text under a cover is still in the file.</b> Anyone with the PDF can select, copy or search it.", "<b>Pero el texto bajo una tapa sigue en el archivo.</b> Cualquiera con el PDF puede seleccionarlo, copiarlo o buscarlo.", "<b>但遮盖下的文字仍在文件中。</b>拿到 PDF 的人都能选中、复制或搜索。", "<b>Pero nasa file pa rin ang teksto sa ilalim ng takip.</b> Mapipili, makokopya o mahahanap ito ng sinumang may PDF.", "<b>Nhưng chữ dưới phần che vẫn nằm trong tệp.</b> Ai có PDF cũng chọn, sao chép hoặc tìm được.", "<b>Mais le texte sous un cache est toujours dans le fichier.</b> Toute personne qui a le PDF peut le sélectionner, le copier ou le rechercher.", "<b>Mas o texto embaixo de uma cobertura continua no arquivo.</b> Qualquer pessoa com o PDF pode selecioná-lo, copiá-lo ou pesquisá-lo.", "<b>لكن النص تحت الغطاء لا يزال في الملف.</b> يمكن لأي شخص لديه ملف PDF تحديده أو نسخه أو البحث فيه."],
      "cw_3": ["To hand out a copy with the answers truly gone, print it on paper, or remove the answers from the original document before making the PDF.", "Para repartir una copia sin las respuestas, imprímela en papel o quita las respuestas del documento original antes de crear el PDF.", "要分发真正没有答案的副本，请打印在纸上，或在生成 PDF 前从原始文档中删除答案。", "Para mamigay ng kopyang talagang walang sagot, i-print ito sa papel, o alisin ang mga sagot sa orihinal na dokumento bago gawin ang PDF.", "Để phát bản thật sự không có đáp án, hãy in ra giấy, hoặc xóa đáp án khỏi tài liệu gốc trước khi tạo PDF.", "Pour distribuer une copie vraiment sans les réponses, imprimez-la sur papier, ou retirez les réponses du document original avant de créer le PDF.", "Para entregar uma cópia realmente sem as respostas, imprima em papel, ou tire as respostas do documento original antes de criar o PDF.", "لتوزيع نسخة بلا إجابات فعلًا، اطبعها على الورق، أو احذف الإجابات من المستند الأصلي قبل إنشاء ملف PDF."],
      "export_anyway": ["Export anyway", "Exportar igual", "仍然导出", "I-export pa rin", "Vẫn xuất", "Exporter quand même", "Exportar mesmo assim", "صدّر على أي حال"],
      /* the "Board not working?" page (app/report/) */
      "r_h1": ["Is OverBoard not working on your board?", "¿OverBoard no funciona en tu pizarra?", "OverBoard 在你的白板上不能用吗？", "Ayaw bang gumana ng OverBoard sa board mo?", "OverBoard không hoạt động trên bảng của bạn?", "OverBoard ne fonctionne pas sur votre tableau ?", "O OverBoard não está funcionando na sua lousa?", "هل لا يعمل OverBoard على سبورتك؟"],
      "r_lead": ["Let's find out why. This takes about two minutes.", "Vamos a averiguar por qué. Tarda unos dos minutos.", "我们来找找原因。大约需要两分钟。", "Alamin natin kung bakit. Mga dalawang minuto lang ito.", "Hãy cùng tìm hiểu nguyên nhân. Chỉ mất khoảng hai phút.", "Voyons pourquoi. Cela prend environ deux minutes.", "Vamos descobrir o porquê. Leva uns dois minutos.", "لنعرف السبب. يستغرق ذلك نحو دقيقتين."],
      "r_intro": ["You'll touch the board a few different ways (finger, pen, your hand), and then answer two quick questions. This page writes down what your board tells the browser, so I can make OverBoard work on boards like yours.", "Vas a tocar la pizarra de varias formas (dedo, lápiz, tu mano) y luego responder dos preguntas rápidas. Esta página anota lo que tu pizarra le dice al navegador, para que yo pueda hacer que OverBoard funcione en pizarras como la tuya.", "你会用几种不同的方式触碰白板（手指、笔、手掌），然后回答两个简单的问题。这个页面会记下你的白板告诉浏览器的信息，这样我就能让 OverBoard 在类似的白板上正常工作。", "Hahawakan mo ang board sa ilang paraan (daliri, pen, palad), tapos sasagot ka ng dalawang mabilis na tanong. Itinatala ng pahinang ito ang sinasabi ng board mo sa browser, para mapagana ko ang OverBoard sa mga board na tulad ng sa iyo.", "Bạn sẽ chạm vào bảng theo vài cách khác nhau (ngón tay, bút, bàn tay), rồi trả lời hai câu hỏi ngắn. Trang này ghi lại những gì bảng của bạn báo cho trình duyệt, để tôi có thể làm OverBoard chạy được trên những bảng như của bạn.", "Vous allez toucher le tableau de plusieurs façons (doigt, stylet, main), puis répondre à deux petites questions. Cette page note ce que votre tableau transmet au navigateur, pour que je puisse faire fonctionner OverBoard sur les tableaux comme le vôtre.", "Você vai tocar a lousa de alguns jeitos (dedo, caneta, mão) e depois responder duas perguntas rápidas. Esta página anota o que a sua lousa informa ao navegador, para eu poder fazer o OverBoard funcionar em lousas como a sua.", "ستلمس السبورة بعدة طرق (الإصبع، القلم، يدك)، ثم تجيب عن سؤالين سريعين. تسجّل هذه الصفحة ما تخبر به سبورتُك المتصفح، حتى أتمكن من جعل OverBoard يعمل على سبورات مثل سبورتك."],
      "r_intro2": ["If something doesn't work the way the page asks, that's fine. <b>That's exactly what I need to know.</b> Just keep going.", "Si algo no funciona como pide la página, no pasa nada. <b>Eso es justo lo que necesito saber.</b> Sigue adelante.", "如果有些步骤不像页面说的那样，没关系。<b>这正是我需要知道的。</b>继续往下做就好。", "Kung may hindi gumana gaya ng hinihingi ng pahina, ayos lang. <b>Iyan mismo ang kailangan kong malaman.</b> Ituloy mo lang.", "Nếu có gì đó không hoạt động như trang yêu cầu, không sao cả. <b>Đó chính là điều tôi cần biết.</b> Cứ tiếp tục nhé.", "Si quelque chose ne marche pas comme la page le demande, ce n'est pas grave. <b>C'est justement ce que j'ai besoin de savoir.</b> Continuez simplement.", "Se algo não funcionar do jeito que a página pede, tudo bem. <b>É exatamente isso que eu preciso saber.</b> É só continuar.", "إذا لم يعمل شيء كما تطلب الصفحة، فلا بأس. <b>هذا بالضبط ما أحتاج إلى معرفته.</b> تابع فقط."],
      "r_privacy": ["Nothing is sent until you press <b>Send</b> at the very end, and you'll see everything first. No worksheets, PDFs or ink are ever included.", "No se envía nada hasta que pulses <b>Enviar</b> al final, y antes verás todo. Nunca se incluyen hojas, PDF ni tinta.", "在你最后按下<b>发送</b>之前，什么都不会发出，而且你会先看到全部内容。绝不会包含练习页、PDF 或笔迹。", "Walang ipapadala hangga't hindi mo pinipindot ang <b>Ipadala</b> sa pinakadulo, at makikita mo muna ang lahat. Hindi kailanman kasama ang mga worksheet, PDF, o tinta.", "Không có gì được gửi đi cho đến khi bạn bấm <b>Gửi</b> ở cuối cùng, và bạn sẽ xem trước mọi thứ. Không bao giờ gửi bài tập, PDF hay nét mực.", "Rien n'est envoyé avant que vous appuyiez sur <b>Envoyer</b> tout à la fin, et vous verrez tout avant. Aucun document, PDF ni encre n'est jamais inclus.", "Nada é enviado até você tocar em <b>Enviar</b> no final, e você vê tudo antes. Nunca são incluídas folhas, PDFs nem tinta.", "لا يُرسل أي شيء حتى تضغط <b>إرسال</b> في النهاية، وسترى كل شيء أولًا. لا تُضمَّن أبدًا أوراق العمل أو ملفات PDF أو الحبر."],

      "r_next": ["Next →", "Siguiente →", "下一步 →", "Susunod →", "Tiếp →", "Suivant →", "Próximo →", "التالي ←"],
      "r_s_finger_t": ["Draw 2 lines with your finger", "Dibuja 2 líneas con el dedo", "用手指画 2 条线", "Gumuhit ng 2 linya gamit ang daliri", "Vẽ 2 đường bằng ngón tay", "Tracez 2 traits avec le doigt", "Desenhe 2 linhas com o dedo", "ارسم خطين بإصبعك"],
      "r_s_finger_x": ["Use one finger. Draw two lines from top to bottom, anywhere in the white area.", "Usa un dedo. Dibuja dos líneas de arriba abajo, en cualquier parte del área blanca.", "用一根手指，在白色区域的任意位置从上往下画两条线。", "Gumamit ng isang daliri. Gumuhit ng dalawang linya mula itaas pababa, kahit saan sa puting bahagi.", "Dùng một ngón tay. Vẽ hai đường từ trên xuống dưới, ở bất kỳ chỗ nào trong vùng trắng.", "Avec un seul doigt, tracez deux traits de haut en bas, n'importe où dans la zone blanche.", "Use um dedo. Desenhe duas linhas de cima para baixo, em qualquer lugar da área branca.", "استخدم إصبعًا واحدًا. ارسم خطين من الأعلى إلى الأسفل في أي مكان من المنطقة البيضاء."],
      "r_s_pen_t": ["Now draw 2 lines with the pen", "Ahora dibuja 2 líneas con el lápiz", "现在用笔画 2 条线", "Ngayon, gumuhit ng 2 linya gamit ang pen", "Giờ vẽ 2 đường bằng bút", "Tracez maintenant 2 traits avec le stylet", "Agora desenhe 2 linhas com a caneta", "الآن ارسم خطين بالقلم"],
      "r_s_pen_x": ["Pick up the board's pen and draw two more lines from top to bottom.", "Toma el lápiz de la pizarra y dibuja dos líneas más de arriba abajo.", "拿起白板的笔，再从上往下画两条线。", "Kunin ang pen ng board at gumuhit ng dalawa pang linya mula itaas pababa.", "Cầm bút của bảng và vẽ thêm hai đường từ trên xuống dưới.", "Prenez le stylet du tableau et tracez deux autres traits de haut en bas.", "Pegue a caneta da lousa e desenhe mais duas linhas de cima para baixo.", "أمسك قلم السبورة وارسم خطين آخرين من الأعلى إلى الأسفل."],
      "r_s_pen_skip": ["I don't have a pen", "No tengo lápiz", "我没有笔", "Wala akong pen", "Tôi không có bút", "Je n'ai pas de stylet", "Não tenho caneta", "ليس لدي قلم"],
      "r_s_palm_t": ["Wipe with your flat hand", "Limpia con la mano abierta", "用手掌抹一下", "Punasan gamit ang nakabukang palad", "Lau bằng cả bàn tay", "Essuyez avec la main à plat", "Passe a mão aberta", "امسح بكف يدك"],
      "r_s_palm_x": ["Put your whole hand flat on the board and wipe across the lines, like wiping a steamy bathroom mirror.", "Pon toda la mano plana sobre la pizarra y pásala por encima de las líneas, como cuando limpias un espejo empañado del baño.", "把整只手平放在白板上，像擦浴室里起雾的镜子一样，在线条上抹过去。", "Ilapat ang buong palad sa board at ipunas sa mga linya, parang nagpupunas ng umusok na salamin sa banyo.", "Áp cả bàn tay lên bảng rồi lau ngang qua các đường, giống như lau gương nhà tắm bị mờ hơi nước.", "Posez toute la main à plat sur le tableau et essuyez les traits, comme on essuie un miroir embué de salle de bain.", "Coloque a mão inteira aberta na lousa e passe por cima das linhas, como quem limpa um espelho embaçado do banheiro.", "ضع يدك كلها مبسوطة على السبورة وامسح فوق الخطوط، كما تمسح مرآة حمّام عليها بخار."],
      "r_s_eraser_t": ["Rub out the lines with the board's eraser", "Borra las líneas con el borrador de la pizarra", "用白板的板擦擦掉线条", "Burahin ang mga linya gamit ang pambura ng board", "Xóa các đường bằng cục tẩy của bảng", "Effacez les traits avec la brosse du tableau", "Apague as linhas com o apagador da lousa", "امسح الخطوط بممحاة السبورة"],
      "r_s_eraser_x": ["If your board came with an eraser (or the pen has an eraser end), rub out the lines with it.", "Si tu pizarra trae borrador (o el lápiz tiene un extremo para borrar), borra las líneas con él.", "如果你的白板带有板擦（或笔的另一头可以擦），就用它把线条擦掉。", "Kung may kasamang pambura ang board mo (o may pambura sa dulo ng pen), burahin ang mga linya gamit iyon.", "Nếu bảng của bạn có kèm cục tẩy (hoặc đầu kia của bút là đầu tẩy), hãy dùng nó để xóa các đường.", "Si votre tableau a une brosse (ou si le stylet a un bout gomme), effacez les traits avec.", "Se a sua lousa veio com apagador (ou a caneta tem uma ponta de apagar), apague as linhas com ele.", "إذا كانت سبورتك تأتي مع ممحاة (أو للقلم طرف ممحاة)، فامسح بها الخطوط."],
      "r_s_eraser_skip": ["My board has no eraser", "Mi pizarra no tiene borrador", "我的白板没有板擦", "Walang pambura ang board ko", "Bảng của tôi không có cục tẩy", "Mon tableau n'a pas de brosse", "Minha lousa não tem apagador", "سبورتي ليس لها ممحاة"],
      "r_s_two_t": ["Drag two fingers down", "Arrastra dos dedos hacia abajo", "两根手指往下拖", "I-drag pababa ang dalawang daliri", "Kéo hai ngón tay xuống", "Faites glisser deux doigts vers le bas", "Arraste dois dedos para baixo", "اسحب إصبعين إلى الأسفل"],
      "r_s_two_x": ["Put two fingers on the board together and drag them down, like scrolling a page.", "Pon dos dedos juntos en la pizarra y arrástralos hacia abajo, como cuando desplazas una página.", "两根手指一起放在白板上往下拖，就像滚动页面一样。", "Ilagay nang sabay ang dalawang daliri sa board at i-drag pababa, parang nag-i-scroll ng pahina.", "Đặt hai ngón tay cùng lúc lên bảng rồi kéo xuống, như khi cuộn trang.", "Posez deux doigts ensemble sur le tableau et faites-les glisser vers le bas, comme pour faire défiler une page.", "Coloque dois dedos juntos na lousa e arraste para baixo, como quem rola uma página.", "ضع إصبعين معًا على السبورة واسحبهما إلى الأسفل، كما تمرّر صفحة."],
      "r_got_1": ["✓ Got it! I saw 1 line.", "✓ ¡Listo! Vi 1 línea.", "✓ 收到！我看到了 1 条线。", "✓ Nakuha ko! May nakita akong 1 linya.", "✓ Được rồi! Tôi thấy 1 đường.", "✓ Bien reçu ! J'ai vu 1 trait.", "✓ Pronto! Vi 1 linha.", "✓ تم! رأيت خطًا واحدًا."],
      "r_got_n": ["✓ Got it! I saw {n} lines.", "✓ ¡Listo! Vi {n} líneas.", "✓ 收到！我看到了 {n} 条线。", "✓ Nakuha ko! May nakita akong {n} linya.", "✓ Được rồi! Tôi thấy {n} đường.", "✓ Bien reçu ! J'ai vu {n} traits.", "✓ Pronto! Vi {n} linhas.", "✓ تم! رأيت {n} خطوط."],
      "r_outside": ["✓ I felt a touch outside the white area. That helps too.", "✓ Noté un toque fuera del área blanca. Eso también ayuda.", "✓ 我感觉到白色区域外有触碰。这也有帮助。", "✓ May naramdaman akong hawak sa labas ng puting bahagi. Nakakatulong din iyan.", "✓ Tôi nhận được một lần chạm bên ngoài vùng trắng. Điều đó cũng có ích.", "✓ J'ai senti un toucher en dehors de la zone blanche. Ça aide aussi.", "✓ Senti um toque fora da área branca. Isso também ajuda.", "✓ شعرت بلمسة خارج المنطقة البيضاء. هذا يساعد أيضًا."],
      "r_touch_1": ["✓ I felt a touch. Try a longer line, or tap Next.", "✓ Noté un toque. Prueba con una línea más larga, o toca Siguiente.", "✓ 我感觉到一次触碰。试着画长一点，或者点“下一步”。", "✓ May naramdaman akong hawak. Subukan ang mas mahabang linya, o i-tap ang Susunod.", "✓ Tôi nhận được một lần chạm. Thử vẽ đường dài hơn, hoặc chạm Tiếp.", "✓ J'ai senti un toucher. Essayez un trait plus long, ou touchez Suivant.", "✓ Senti um toque. Tente uma linha mais longa ou toque em Próximo.", "✓ شعرت بلمسة. جرّب خطًا أطول، أو اضغط التالي."],
      "r_touch_n": ["✓ I felt {n} touches. Try a longer line, or tap Next.", "✓ Noté {n} toques. Prueba con una línea más larga, o toca Siguiente.", "✓ 我感觉到 {n} 次触碰。试着画长一点，或者点“下一步”。", "✓ May naramdaman akong {n} hawak. Subukan ang mas mahabang linya, o i-tap ang Susunod.", "✓ Tôi nhận được {n} lần chạm. Thử vẽ đường dài hơn, hoặc chạm Tiếp.", "✓ J'ai senti {n} touchers. Essayez un trait plus long, ou touchez Suivant.", "✓ Senti {n} toques. Tente uma linha mais longa ou toque em Próximo.", "✓ شعرت بـ {n} لمسات. جرّب خطًا أطول، أو اضغط التالي."],
      "r_other": ["✓ Something happened, but not a line (maybe the page tried to scroll). That helps too.", "✓ Pasó algo, pero no una línea (quizá la página intentó desplazarse). Eso también ayuda.", "✓ 有反应，但不是一条线（可能页面想要滚动）。这也有帮助。", "✓ May nangyari, pero hindi linya (baka nag-scroll ang pahina). Nakakatulong din iyan.", "✓ Có gì đó xảy ra, nhưng không phải một đường (có thể trang đã cố cuộn). Điều đó cũng có ích.", "✓ Il s'est passé quelque chose, mais pas un trait (la page a peut-être essayé de défiler). Ça aide aussi.", "✓ Algo aconteceu, mas não uma linha (talvez a página tenha tentado rolar). Isso também ajuda.", "✓ حدث شيء، لكنه ليس خطًا (ربما حاولت الصفحة التمرير). هذا يساعد أيضًا."],
      "r_waiting": ["Waiting… touch the white area.", "Esperando… toca el área blanca.", "等待中… 请触碰白色区域。", "Naghihintay… hawakan ang puting bahagi.", "Đang chờ… hãy chạm vào vùng trắng.", "En attente… touchez la zone blanche.", "Aguardando… toque na área branca.", "في الانتظار… المس المنطقة البيضاء."],
      "r_nothing": ["Nothing has shown up. That's useful to know too: tap Next.", "No ha aparecido nada. Eso también es útil saberlo: toca Siguiente.", "什么都没出现。这也是有用的信息：点“下一步”。", "Walang lumabas. Kapaki-pakinabang din iyan: i-tap ang Susunod.", "Chưa thấy gì xuất hiện. Điều đó cũng hữu ích: hãy chạm Tiếp.", "Rien n'est apparu. C'est utile à savoir aussi : touchez Suivant.", "Nada apareceu. Isso também é útil saber: toque em Próximo.", "لم يظهر شيء. من المفيد معرفة ذلك أيضًا: اضغط التالي."],
      "r_nothing_help": ["If tapping Next doesn't work either, use the computer's mouse or press Enter.", "Si tocar Siguiente tampoco funciona, usa el ratón de la computadora o pulsa Enter.", "如果点“下一步”也没反应，请用电脑的鼠标，或按回车键。", "Kung hindi rin gumana ang pag-tap sa Susunod, gamitin ang mouse ng computer o pindutin ang Enter.", "Nếu chạm Tiếp cũng không được, hãy dùng chuột máy tính hoặc nhấn Enter.", "Si toucher Suivant ne marche pas non plus, utilisez la souris de l'ordinateur ou appuyez sur Entrée.", "Se tocar em Próximo também não funcionar, use o mouse do computador ou aperte Enter.", "إذا لم ينجح الضغط على التالي أيضًا، فاستخدم فأرة الكمبيوتر أو اضغط Enter."],

      "r_q_brand": ["1. What brand is your board?", "1. ¿De qué marca es tu pizarra?", "1. 你的白板是什么牌子？", "1. Anong brand ang board mo?", "1. Bảng của bạn là hãng nào?", "1. De quelle marque est votre tableau ?", "1. Qual é a marca da sua lousa?", "1. ما علامة سبورتك التجارية؟"],
      "r_q_brand_hint": ["The name is usually printed on the front, below or beside the screen.", "El nombre suele estar impreso en el frente, debajo o al lado de la pantalla.", "牌子通常印在正面，屏幕下方或旁边。", "Karaniwang nakaimprenta ang pangalan sa harap, sa ilalim o tabi ng screen.", "Tên hãng thường in ở mặt trước, bên dưới hoặc bên cạnh màn hình.", "Le nom est en général écrit sur l'avant, sous l'écran ou à côté.", "O nome costuma estar impresso na frente, abaixo ou ao lado da tela.", "عادةً ما يكون الاسم مطبوعًا في الأمام، أسفل الشاشة أو بجانبها."],

      fitToolbar();
      size();
      window.scrollTo(cx * Z - innerWidth / 2, cy * Z - innerHeight / 2);
    }
    fitBtn.textContent = zoomFit ? tr('fit') : Math.round(Z * 100) + '%';
  }
  holdRepeat(bar.querySelector('[data-act="zoom-in"]'), function(){ if (Z >= 4) return false; setZoom(Z * 1.1); return true; });
  holdRepeat(bar.querySelector('[data-act="zoom-out"]'), function(){ if (Z <= 0.3) return false; setZoom(Z / 1.1); return true; });
  window.addEventListener('wheel', function(e){   // trackpad pinch / Ctrl+wheel zooms the worksheet, not the toolbar
    if (!e.ctrlKey) return;
    e.preventDefault();
    setZoom(Z * Math.exp(-e.deltaY * 0.01));
  }, { passive: false });
  window.addEventListener('resize', function(){ fitToolbar(); if (zoomFit) setZoom('fit'); });
  // The browser can only write into a file you point it at, and the Mac's picker window always says "Open".
  // So the first tap explains that, and the second tap opens the picker.
  function explainPick(btn, forcePick){
    if (!btn.classList.contains('warn')) {
      var name = decodeURIComponent(location.pathname.split('/').pop()) || tr('this_worksheet');
      setStatus(tr('explain_pick', { f: name }));
      btn._label = btn._label || btn.textContent; btn.classList.add('warn'); btn.textContent = tr('tap_again_pick');
      btn._timer = setTimeout(function(){ btn.classList.remove('warn'); btn.textContent = btn._label; setStatus(tr('st_ready', { p: D.active })); }, 10000);
      return;
    }
    clearTimeout(btn._timer); btn.classList.remove('warn'); btn.textContent = btn._label;
    saveAndShow(document.querySelector('#ob-filemenu [data-act="savefile"]'), forcePick);
  }
  document.addEventListener('keydown', function(e){
    var h = historyKey(e), t = document.activeElement;   // Ctrl/⌘+Z undo; Ctrl/⌘+Y, Ctrl/⌘+R or Ctrl/⌘+Shift+Z redo; keyboard reload is off
    if (!h || (h !== 'block' && t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)))) return;   // text boxes keep their own undo
    e.preventDefault();
    if (h !== 'block' && ready) (h === 'undo' ? undo : redo)();
  });

  /* ---------- print / Save PDF: redraw the current period's ink onto each page at print sharpness ---------- */
  function clearPrint(){ [].forEach.call(document.querySelectorAll('canvas.ink-print'), function(c){ c.remove(); }); }
  function buildPrint(){
    clearPrint();
    var list = [].slice.call(document.querySelectorAll('.page'));
    if (!list.length) list = [body];
    var ctop = canvas.getBoundingClientRect().top, hasHl = !PRINT_INK_BLACK && strokes.some(seeThrough);
    list.forEach(function(pg){
      var ph = pg.offsetHeight, pw = pg.offsetWidth, top = (pg === body) ? 0 : pg.getBoundingClientRect().top - ctop;
      var ps = Math.min(PRINT_SCALE, 30000 / ph, Math.sqrt(60e6 / (CW * ph)));
      // only the page column prints; ink out in the side space stays on screen
      (hasHl ? ['hl', 'ink'] : ['ink']).forEach(function(layer){
        var c = document.createElement('canvas'), cx = c.getContext('2d');
        c.className = 'ink-print'; c.width = Math.round(CW * ps); c.height = Math.round(ph * ps);
        strokes.forEach(function(s){
          if (layer === 'hl' ? (seeThrough(s) || s.e) : (!seeThrough(s) || s.e)) paintStroke(cx, (PRINT_INK_BLACK && !s.e) ? { c: '#111', w: s.w, e: 0, p: s.p } : s, ps, 0, -top * ps);
        });
        c.style.cssText = 'position:absolute;top:0;left:' + (-(CW - pw) / 2) + 'px;width:' + CW + 'px;height:' + ph + 'px;pointer-events:none;z-index:5' + (layer === 'hl' ? ';mix-blend-mode:multiply' : '');
        pg.appendChild(c);
      });
    });
  }
  var printZoom = 1;   // pages print at their real size, so print at 100% and put the zoom back after
  window.addEventListener('beforeprint', function(){ printZoom = zoomFit ? 'fit' : Z; if (Z !== 1) setZoom(1); buildPrint(); });
  window.addEventListener('afterprint', function(){ clearPrint(); if (printZoom !== 1) setZoom(printZoom); });

  /* ---------- never lose the last few seconds of ink ---------- */
  window.addEventListener('pagehide', function(){ writeLocal(true, true); });
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden') writeLocal(true, true); });

  /* ---------- start ---------- */
  var src = load(); size(); translateAll(); renderPeriods(); refresh(); setMode('write'); layoutClear(); fitToolbar();
  window.addEventListener('resize', size);
  window.addEventListener('load', size);
  if (window.ResizeObserver) new ResizeObserver(size).observe(body);
  function started(src){ setStatus(tr(src === 'file' ? 'st_loaded_file' : src === 'browser' ? 'st_restored' : src === 'old' ? 'st_old_carried' : 'st_ready', { p: D.active })); }
  setStatus(tr('st_loading', { p: D.active }));
  loadDb().then(function(s){
    if (s) { redraw(); renderPeriods(); refresh(); layoutClear(); }
    started(s || src);
    bar.dataset.ready = '1';   // tests wait for this
  });
  if (FSA) idb('readonly', function(st){ return st.get(KEY); }).then(function(h){
    if (!h) return;
    fileHandle = h;
    hasPermission(false).then(function(ok){
      setStatus(tr(ok ? 'st_autosaving' : 'st_reconnect', { p: D.active, f: h.name }));
    }).catch(function(){});
  });
})();
</script>
